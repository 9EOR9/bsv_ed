name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Version in den Manifesten prüfen
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          for f in mod_bsv_ergebnisse/mod_bsv_ergebnisse.xml plg_system_bsvergebnisse/bsvergebnisse.xml; do
            V=$(sed -n 's:.*<version>\(.*\)</version>.*:\1:p' "$f" | head -1)
            if [ "$V" != "$TAG" ]; then
              echo "Version in $f ($V) passt nicht zum Tag ($TAG)"
              exit 1
            fi
          done

      - name: ZIPs bauen
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          mkdir dist
          git archive --format=zip -o "dist/mod_bsv_ergebnisse-$TAG.zip" HEAD:mod_bsv_ergebnisse
          git archive --format=zip -o "dist/plg_system_bsvergebnisse-$TAG.zip" HEAD:plg_system_bsvergebnisse

      - name: Release anlegen
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/*.zip --title "$GITHUB_REF_NAME" --generate-notes
